[package]
name = "ai-ui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider trait, state, and reference providers for ai-ui. No HTTP; use ai-ui-axum for that."

# Default features intentionally empty — BYO AI. Reference providers opt in.
[features]
default = []
openai-proxy = ["dep:reqwest", "dep:async-stream"]
claude-cli = ["dep:claude-wrapper", "dep:uuid"]

[dependencies]
ai-ui-types = { workspace = true }
ai-ui-skills = { workspace = true }
ai-ui-prompt = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

# only needed by reference providers — gated by their features
async-stream = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
claude-wrapper = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
